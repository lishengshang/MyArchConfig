# =============================================================================
# lint.yml - 多语言静态检查 + 敏感信息扫描
# =============================================================================
name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    name: shell and config static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install interpreters and validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish zsh stow

      - name: Run config static checks (TOML / JSONC / systemd units)
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          # TOML + JSONC：与本地共用同一脚本（零第三方依赖，Python >= 3.11）
          if ! python3 tests/config/check_toml_jsonc.py; then
            echo "TOML/JSONC checks FAILED"
            fail=1
          fi

          # systemd user units：systemd-analyze verify 语法校验。
          # CI 的 $HOME 下没有 ExecStart 指向的用户脚本/二进制（niri-clip、
          # 各 wrapper 等），"is not executable" 属预期噪音——已在 Arch
          # (systemd 257) 上验证仓库全部 units 输出为空，故仅过滤该模式，
          # 其余任何输出（语法错误、未知键等）都视为失败。
          systemd_fail=0
          for u in home/.config/systemd/user/*.service home/.config/systemd/user/*.timer; do
            [[ -e "$u" ]] || continue
            out=$(systemd-analyze verify --man=no "$u" 2>&1) || true
            [[ -z "$out" ]] && { echo "  systemd ok: $u"; continue; }
            filtered=$(printf '%s\n' "$out" | grep -v 'is not executable' || true)
            if [[ -n "$filtered" ]]; then
              echo "  systemd verify FAIL: $u"
              printf '%s\n' "$filtered"
              systemd_fail=1
            else
              echo "  systemd ok (ExecStart 在 CI 上不可执行, 属预期): $u"
            fi
          done
          [[ "$systemd_fail" -eq 0 ]] || fail=1

          exit "$fail"

      - name: Run language-aware static checks
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          # 检查配置目录和测试目录中的脚本，而不是只检查仓库根目录。
          # 脚本按 shebang 选择解释器；仓库中存在 Fish 代码使用 .sh 扩展名的历史文件。
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -path '*/scripts/*' -o -path './tests/zsh/*.sh' \) -not -path './.git/*' -not -path './home/.config/fish/completions/*' | sort)

          for f in "${files[@]}"; do
            [[ -s "$f" ]] || continue
            shebang=$(head -n 1 "$f")
            echo "::group::$f"
            case "$shebang" in
              *fish*)
                if fish -n "$f"; then
                  echo "  fish -n ok"
                else
                  echo "  fish -n FAIL"
                  fail=1
                fi
                ;;
              *zsh*)
                if zsh -n "$f"; then
                  echo "  zsh -n ok"
                else
                  echo "  zsh -n FAIL"
                  fail=1
                fi
                ;;
              */bash*|*/sh|*' sh'*)
                if bash -n "$f"; then
                  echo "  bash -n ok"
                else
                  echo "  bash -n FAIL"
                  fail=1
                fi
                # 先让真正的 ShellCheck error 阻断 CI；已有 warning 后续单独清理。
                if shellcheck -S error "$f"; then
                  echo "  shellcheck errors: none"
                else
                  echo "  shellcheck errors: found"
                  fail=1
                fi
                ;;
              *)
                echo "  skipped: unsupported or missing shell shebang"
                ;;
            esac
            echo "::endgroup::"
          done

          # Fish 配置和补全不一定位于 scripts/ 目录，额外检查其扩展名文件。
          while IFS= read -r -d '' f; do
            if ! fish -n "$f"; then
              echo "fish -n FAIL: $f"
              fail=1
            fi
          done < <(find home -type f -name '*.fish' -print0)

          while IFS= read -r -d '' f; do
            if ! zsh -n "$f"; then
              echo "zsh -n FAIL: $f"
              fail=1
            fi
          done < <(find home tests -type f -name '*.zsh' -print0 2>/dev/null)

          while IFS= read -r -d '' f; do
            if ! python3 -m py_compile "$f"; then
              echo "python compile FAIL: $f"
              fail=1
            fi
          done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          exit "$fail"

      - name: Run Stow temporary HOME integration test
        run: tests/stow/integration.sh

  niri-kdl-validate:
    # niri 官方 release 不提供预编译二进制，ubuntu 也无包；
    # 用 Arch 容器（niri 配置的"原生产地"，版本与作者机器同源）做 KDL 校验。
    name: niri config KDL validation
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install niri
        run: pacman -Sy --noconfirm niri

      - name: Validate niri config
        run: niri validate -c home/.config/niri/config.kdl
        # 缺少 matugen 生成的 colors.kdl 只是 optional include 的 WARN，不阻断。

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Public repositories do not need a Gitleaks license token.
      # GITHUB_TOKEN allows the action to report findings on the workflow run.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
