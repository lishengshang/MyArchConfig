# =============================================================================
# lint.yml - 多语言静态检查 + 敏感信息扫描
# =============================================================================
name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    name: shell and config static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install interpreters and validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish zsh stow

      - name: Run language-aware static checks
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          # 检查配置目录和测试目录中的脚本，而不是只检查仓库根目录。
          # 脚本按 shebang 选择解释器；仓库中存在 Fish 代码使用 .sh 扩展名的历史文件。
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -path '*/scripts/*' -o -path './tests/zsh/*.sh' \) -not -path './.git/*' -not -path './home/.config/fish/completions/*' | sort)

          for f in "${files[@]}"; do
            [[ -s "$f" ]] || continue
            shebang=$(head -n 1 "$f")
            echo "::group::$f"
            case "$shebang" in
              *fish*)
                if fish -n "$f"; then
                  echo "  fish -n ok"
                else
                  echo "  fish -n FAIL"
                  fail=1
                fi
                ;;
              *zsh*)
                if zsh -n "$f"; then
                  echo "  zsh -n ok"
                else
                  echo "  zsh -n FAIL"
                  fail=1
                fi
                ;;
              */bash*|*/sh|*' sh'*)
                if bash -n "$f"; then
                  echo "  bash -n ok"
                else
                  echo "  bash -n FAIL"
                  fail=1
                fi
                # 先让真正的 ShellCheck error 阻断 CI；已有 warning 后续单独清理。
                if shellcheck -S error "$f"; then
                  echo "  shellcheck errors: none"
                else
                  echo "  shellcheck errors: found"
                  fail=1
                fi
                ;;
              *)
                echo "  skipped: unsupported or missing shell shebang"
                ;;
            esac
            echo "::endgroup::"
          done

          # Fish 配置和补全不一定位于 scripts/ 目录，额外检查其扩展名文件。
          while IFS= read -r -d '' f; do
            if ! fish -n "$f"; then
              echo "fish -n FAIL: $f"
              fail=1
            fi
          done < <(find home -type f -name '*.fish' -print0)

          while IFS= read -r -d '' f; do
            if ! zsh -n "$f"; then
              echo "zsh -n FAIL: $f"
              fail=1
            fi
          done < <(find home tests -type f -name '*.zsh' -print0 2>/dev/null)

          while IFS= read -r -d '' f; do
            if ! python3 -m py_compile "$f"; then
              echo "python compile FAIL: $f"
              fail=1
            fi
          done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          exit "$fail"

      - name: Run Stow temporary HOME integration test
        run: tests/stow/integration.sh

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Public repositories do not need a Gitleaks license token.
      # GITHUB_TOKEN allows the action to report findings on the workflow run.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
