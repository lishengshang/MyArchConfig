# Input method environment for fcitx5
# Wayland 原生应用通过 text-input-v3 自动接入,不依赖以下变量。
# 不再全局设置；需要 XWayland 的软件请在其 .desktop 或启动命令中单独设置。
# XMODIFIERS=@im=fcitx
# GTK_IM_MODULE=fcitx
# QT_IM_MODULE=fcitx
# SDL_IM_MODULE=fcitx
# INPUT_METHOD=fcitx
# GLFW (kitty 等) 只识别 ibus 字符串；需要时请给具体软件单独设置。
# GLFW_IM_MODULE=ibus
