# ============================================================================
# ~/.config/environment.d/30-history.conf
# ============================================================================
# 把各种 *_history 文件从 $HOME 根目录挪到 XDG_STATE_HOME 下面。
# 不改变行为，仅改位置。
# ============================================================================

# --- Bash 交互历史（bash 原生支持 HISTFILE）---
HISTFILE=${XDG_STATE_HOME}/bash/history

# --- Python REPL 历史（CPython 3.13+ 原生支持 PYTHON_HISTORY）---
PYTHON_HISTORY=${XDG_STATE_HOME}/python/history
