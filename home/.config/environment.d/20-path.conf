# ============================================================================
# ~/.config/environment.d/20-path.conf
# ============================================================================
# PATH 在这里集中声明，避免 zsh/fish 各自重复添加
# 注意：systemd 默认 PATH 是 /usr/local/sbin:/usr/local/bin:/usr/bin
# 所以我们用 ${PATH} 在末尾追加，保留系统默认
# ============================================================================

PATH=${HOME}/.local/bin:${HOME}/.local/share/uv/bin:${HOME}/.cargo/bin:${HOME}/.bun/bin:${PATH}
