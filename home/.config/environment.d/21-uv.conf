# ============================================================================
# ~/.config/environment.d/21-uv.conf - uv (Python 包管理器) 配置
# ============================================================================
# uv 是现代 Python 包/项目管理器（替代 pip + virtualenv + pyenv）。
#
# uv 把 Python 解释器、tool venv 都放在 ~/.local/share/uv/ 下，符合 XDG 规范。
# 这里只设置 UV_TOOL_BIN_DIR 让 uv tool install 装的 CLI 软链接放到
# ~/.local/share/uv/bin/（已在 PATH），保持 ~/.local/bin 干净。
#
# 工作流：
#   - CLI 工具:  uv tool install <pkg>       (替代 pip install --user)
#   - 项目依赖:  uv venv + uv pip install    (项目级隔离)
#   - 一次性跑:  uvx <pkg>                   (替代 pipx run)
# ============================================================================

UV_TOOL_BIN_DIR=${HOME}/.local/share/uv/bin
