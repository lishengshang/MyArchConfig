# 音频设备策略（本机定制；排查背景与验证记录见 MAINTENANCE_PLAN.md P6-1）
#
# 作用：让 USB 声卡不自动抢占「默认输出」；蓝牙耳机与内置声卡保持原有自动接管。
#
# 为什么需要（本机实测的上游逻辑）：
#   * 默认设备的选择规则在 /usr/share/wireplumber/scripts/default-nodes/：
#       "用户指定的默认设备"(+30000) > "历史用过的设备"(+20001-i) > 按
#       priority.session 排序的"最优设备"。
#   * 各节点的优先级由监视器脚本算出：
#       内置模拟输出 = 1009  (monitors/alsa.lua：dev 0 → 1000，analog +9)
#       蓝牙 A2DP 输出 = 1010 (monitors/bluez/name-node.lua)
#       USB 模拟输出 ≈ 1100  (alsa.lua：analog +9 且 usb 再 +100)
#     即 USB 声卡优先级最高，一插上就会顶掉蓝牙与内置输出。
#   * 本机两个 USB 音频设备（Jieli 无线接收器、KTMicro Z2 有线声卡）都存在
#     周期性掉线重连记录（内核 usb -71 枚举失败循环），会让默认输出反复跳变，
#     所以按负责人决定：USB 声卡不参与自动抢占。
#
# 行为：
#   * 只把 USB「输出」节点的 priority.session 压到内置声卡之下（700）；
#     输入侧不动 —— USB 耳麦接上仍会自动接管默认输入。
#   * 需要把 USB 声卡当主输出时，手动选一次即可：`wpctl set-default <id>`
#     或 pavucontrol 的"设为后备"。该选择会写入 default.configured.audio.sink
#     并享受 +30000 权重，之后长期生效（与优先级无关）。
#   * 只有内置/蓝牙都不存在时，USB 声卡才会被自动选中。

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output\\.usb-.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 700
      }
    }
  }
]