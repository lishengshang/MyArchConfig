[config]
reload_apps = true

# 如果你需要壁纸联动，取消下面注释（以 swww 为例）
# [config.wallpaper]
# command = "swww"
# arguments = ["img", "--transition-type", "center"]
# set = true

[templates.starship]
input_path  = '~/.config/matugen/templates/starship-colors.toml'
output_path = '~/.config/starship/colors.toml'
# 注意：post_hook 属于 [templates.starship] 内部字段，不是独立表
post_hook = "cat ~/.config/starship/base.toml ~/.config/starship/colors.toml > ~/.config/starship.toml"

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook='mkdir -p ~/.config/waybar-niri-Win11Like && rm -f ~/.config/waybar-niri-Win11Like/colors.css && ln -s ~/.config/waybar/colors.css ~/.config/waybar-niri-Win11Like/colors.css'

# pywalfox 未安装，先禁用
# [templates.pywalfox]
# input_path = '~/.config/matugen/templates/pywalfox-colors.json'
# output_path = '~/.cache/wal/colors.json'
# post_hook = 'pywalfox update &'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path ='~/.config/kitty/themes/matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all matugen &"

