# Niri reloads this small included file to apply the focus-ring colors.
# reload_apps=false above prevents that reload from restarting applications.
[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.gtk-folder]
input_path = '~/.config/matugen/templates/gtk-folder/recolor.sh'
output_path = '~/.cache/matugen/recoloricons.sh'
# Recolor the Adwaita-derived folder/mimetype icons in the background and switch
# to the completed A/B theme only after all files are ready.
post_hook = 'bash ~/.cache/matugen/recoloricons.sh &>/dev/null &'

[templates.swayosd]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swayosd/colors.css'
# Do not kill/restart swayosd on every wallpaper.  The server keeps running;
# its colors are refreshed on the next service start.

[templates.swaylock-effects]
input_path = '~/.config/matugen/templates/swaylock-colors'
output_path = '~/.config/swaylock/config'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.neovim]
input_path = '~/.config/matugen/templates/neovim/template.lua'
output_path = '~/.config/nvim/generated.lua'
# Existing Neovim instances must not be signalled during a wallpaper change;
# the generated colors are used by newly opened instances.

[templates.hyprlock]
# 供 niri 下的 hyprlock 使用（hyprlock.conf source 该文件）
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.cache/matugen/hypr/colors.conf'
pre_hook = 'mkdir -p ~/.cache/matugen/hypr/'

# VS Code settings are intentionally not rewritten on every wallpaper change;
# changing settings.json can make an existing editor repaint or reload.
