[config]
# Do not ask Matugen to reload every detected application after each wallpaper.
# That reload includes the compositor/session and is the source of visible
# flashes.  Individual lightweight hooks below handle the few services that
# can safely refresh themselves.
reload_apps = false

# 如果你需要壁纸联动，取消下面注释（以 swww 为例）
# [config.wallpaper]
# command = "swww"
# arguments = ["img", "--transition-type", "center"]
# set = true

[templates.starship]
input_path  = '~/.config/matugen/templates/starship-colors.toml'
output_path = '~/.config/starship/colors.toml'
# 注意：post_hook 属于 [templates.starship] 内部字段，不是独立表
post_hook = "cat ~/.config/starship/base.toml ~/.config/starship/colors.toml > ~/.config/starship.toml"

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'mkdir -p ~/.config/waybar-niri-Win11Like && rm -f ~/.config/waybar-niri-Win11Like/colors.css && ln -s ~/.config/waybar/colors.css ~/.config/waybar-niri-Win11Like/colors.css; ~/.config/scripts/waybar-reload-colors.sh'

# pywalfox 未安装，先禁用
# [templates.pywalfox]
# input_path = '~/.config/matugen/templates/pywalfox-colors.json'
# output_path = '~/.cache/wal/colors.json'
# post_hook = 'pywalfox update &'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path ='~/.config/kitty/themes/matugen.conf'
# Theme file is still generated for newly opened Kitty instances. Do not
# reload every existing terminal during a wallpaper change.

# Fcitx5 is generated by matugen-fcitx5.sh in matugen-update.sh.  It uses a
# minimal config to produce both light and dark themes without running the full
# template set a second time.

[templates.mako]
input_path = '~/.config/matugen/templates/mako-colors.conf'
output_path = '~/.config/mako/colors.conf'
post_hook='makoctl reload &>/dev/null &'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
# btop reads the generated theme on its next start; do not signal running apps.

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'
#post_hook = "pkill -USR1 cava"

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

