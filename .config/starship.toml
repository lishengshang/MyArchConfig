style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[ruby]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[elm]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[erlang]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[elixir]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[scala]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[swift]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[dart]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[lua]
