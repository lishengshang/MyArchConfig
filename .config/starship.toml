# --------------------------------------------------
# 工具与环境模块
# --------------------------------------------------
[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_fg0 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[cmake]
symbol = " "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[helm]
symbol = "⎈ "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[terraform]
symbol = "󱁢 "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[nix_shell]
symbol = " "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol$state ]($style)"

[aws]
symbol = " "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol$profile ]($style)"

[gcloud]
symbol = " "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol$account ]($style)"

[azure]
symbol = " "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol$subscription ]($style)"

[vagrant]
symbol = "⍱ "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[kubernetes]
symbol = "☸ "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol$context ]($style)"

[buf]
symbol = " "
style = "bg:color_bg3 fg:color_fg0"
format = "[ $symbol($version) ]($style)"

# --------------------------------------------------
# 时间与提示符
# --------------------------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg1 bg:color_bg1)]($style)'

[cmd_duration]
min_time = 0
format = "[ 󰄉 $duration ]($style)"
style = "bg:color_bg1"
show_milliseconds = true        # 显示毫秒


# --------------------------------------------------
# 内存占用
# --------------------------------------------------
[memory_usage]
disabled = false
threshold = 0          # 始终显示，不隐藏
symbol = "󰍛 MEM "          # 内存图标（Nerd Font）
#style = "bold dimmed white"
style = "bg:color_bg1"
format = "[ $symbol$ram_pct \\[$ram\\] ]($style)"
#format = "[ $symbol$ram_pct ($ram) | $swap_pct ($swap) ]($style)"

[line_break]


[palettes.matugen_colors]
color_orange = "#ffe0b4"
color_yellow = "#d8c4a7"
color_aqua   = "#deebb0"

color_blue   = "#e9c388"
color_bg3    = "#221f1b"
color_bg1    = "#2d2925"

color_fg0    = "#432c00"
color_fg1    = "#e9e1da"

color_green  = "#deebb0"
color_red    = "#ffb4ab"
