"$schema" = 'https://starship.rs/config-schema.json'
# 引用下文 matugen 生成的调色板名称
palette = 'matugen_colors'

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$ruby\
$elm\
$erlang\
$elixir\
$scala\
$swift\
$dotnet\       
$dart\
$lua\
$nim\
$zig\
$julia\
$crystal\
$perl\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
$cmake\
$helm\
$terraform\
$nix_shell\
$aws\
$gcloud\
$azure\
$vagrant\
$kubernetes\
$buf\
[](fg:color_bg3)$fill[](color_bg1)$memory_usage$time[](color_bg1)
$character"""

right_format = """[](color_bg1)$cmd_duration[](color_bg1)"""


# --------------------------------------------------
# 操作系统模块
# --------------------------------------------------
[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# --------------------------------------------------
# 用户名模块
# --------------------------------------------------
[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

# --------------------------------------------------
# 目录模块
# --------------------------------------------------
[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# --------------------------------------------------
# Git 模块
# --------------------------------------------------
[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[ $all_status$ahead_behind ](fg:color_fg0 bg:color_aqua)]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = " ${count}"
staged = "[ ${count}](fg:color_blue)"
renamed = "»${count}"
deleted = "✘${count}"


# --------------------------------------------------
# 编程语言模块
# --------------------------------------------------
[nodejs]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = "[ $symbol($version) ]($style)"

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
