# ============================================================================
# ~/.config/environment.d/10-shell.conf
# ============================================================================
# 此文件被 systemd 在用户会话启动时加载（pam_systemd → user@.service）
# 所有 GUI 程序、TTY、SSH 子进程都能看到这些变量
# 因此 zsh / fish / bash / nvim / niri 全部共享！
#
# 语法：纯 KEY=VALUE
#   - 支持 ${VAR} 引用其他变量
#   - 不支持命令替换 $(...)、shell 逻辑、条件判断
#   - 修改后需要重新登录或: systemctl --user import-environment
# ============================================================================

# --- XDG 基础目录规范 ---
XDG_CONFIG_HOME=${HOME}/.config
XDG_CACHE_HOME=${HOME}/.cache
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state

# --- Zsh 配置目录（XDG 规范，zsh 原生读取 $ZDOTDIR/.zshenv 和 .zshrc）---
ZDOTDIR=${HOME}/.config/zsh

# --- 编辑器 ---
EDITOR=nvim
VISUAL=nvim
SUDO_EDITOR=nvim
PAGER=less
MANPAGER=nvim +Man!

# --- 语言区域 ---
LANG=zh_CN.UTF-8

# --- less 行为 ---
LESS=-R -i -F -X --mouse

# --- 工具特定 ---
BUN_INSTALL=${HOME}/.bun
VAPOURSYNTH_PLUGIN_PATH=/usr/lib/vapoursynth

# --- FZF 默认选项（zsh/fish 都用同一份）---
FZF_DEFAULT_COMMAND=fd --type f --hidden --follow --exclude .git
FZF_CTRL_T_COMMAND=fd --type f --hidden --follow --exclude .git
FZF_ALT_C_COMMAND=fd --type d --hidden --follow --exclude .git
