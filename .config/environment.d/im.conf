# Input method environment for fcitx5
# Wayland 原生应用通过 text-input-v3 自动接入,不依赖以下变量
# 以下变量主要给 XWayland 应用 (Chrome/Electron/Steam/JetBrains 等)
XMODIFIERS=@im=fcitx
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
SDL_IM_MODULE=fcitx
INPUT_METHOD=fcitx
# GLFW (kitty 等) 只识别 ibus 字符串,fcitx5 提供 ibus 兼容前端
GLFW_IM_MODULE=ibus
