# --- 音乐组件 (优先 Playing 状态的播放器) ---
label {
    monitor =
    # 用脚本：遍历所有播放器，找到第一个 Playing 状态的，输出其 metadata
    # 没有播放器在播时输出 "♪ Not Playing"
    text = cmd[update:2000] bash ~/.config/niri/scripts/hyprlock-music.sh
    color = $secondary
    font_size = 16
    font_family = $font
    
    # 位置：放在底部，输入框上方
    position = 0, 15%
    halign = center
    valign = bottom
}

# ==========================
# === 底部交互区 ===
# ==========================

# Input Field (输入框 - 超圆角药丸形状)
input-field {
    monitor =
    size = 9%, 3.1%
    outline_thickness = 2

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    # 圆角设置为 24，实现胶囊形状
    rounding = 24  
    
    # 颜色配置
    outer_color = $primary $tertiary $primary 
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $secondary
    fail_color = $error

    fade_on_empty = false
    placeholder_text = <i>输入密码</i>

    # 位置：底部 8%
    position = 0, 8%
    halign = center
    valign = bottom
}

