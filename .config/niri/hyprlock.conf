# =================================================
# Hyprlock 完整配置文件
# 包含：时间、天气、音乐、圆角输入框、电源按钮
# =================================================

# 引入 Matugen 生成的颜色文件
source = ~/.cache/matugen/hypr/colors.conf

# 定义字体变量
$font = JetBrains Mono Nerd Font
$font_clock = JetBrains Mono Nerd Font

general {
    hide_cursor = false       
    ignore_empty_input = true 
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.cache/.current_wallpaper
    color = $surface

    # 模糊与质感
    blur_size = 5
    blur_passes = 4
    noise = 0.01
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# ==========================
# === 核心时间布局 (上移) ===
# ==========================

# Hours (小时)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%H")</big></b>"
    color = $primary
    font_size = 130
    font_family = $font_clock
    shadow_passes = 3
    shadow_size = 4
    position = 0, 29%
    halign = center
    valign = center
}

# Minutes (分钟)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%M")</big></b>"
    color = $primary
    font_size = 130
    font_family = $font_clock
    shadow_passes = 3
    shadow_size = 4
    position = 0, 16%
    halign = center
    valign = center
}

# Date (日期)
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +'%A, %-m月%d日')</b>"
    color = $secondary
    font_size = 22
    font_family = $font
    position = 0, 6%
    halign = center
    valign = center
}

